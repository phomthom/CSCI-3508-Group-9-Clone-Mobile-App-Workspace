t:700;color:var(--green);background:#e5ede3;border-radius:14px;padding:7px 11px}.art{position:relative;height:266px;margin:22px 0}.circle{position:absolute;width:228px;height:228px;border-radius:50%;background:#eeeadf;left:50%;transform:translateX(-50%);top:6px}.book{position:absolute;width:144px;height:176px;padding:17px;border-radius:12px;border-left:5px solid #00000018;background:var(--green);color:white;left:30px;top:44px;transform:rotate(-11deg)}.book.gold{background:var(--gold);color:var(--ink);left:auto;right:20px;top:78px;transform:rotate(9deg)}.book small{font-size:9px;letter-spacing:1px;font-weight:700;display:block}.book strong{display:block;font-size:25px;line-height:1.15;letter-spacing:-.7px;margin-top:20px}.book:after{content:"";display:block;width:34px;height:3px;background:currentColor;margin-top:16px}.swap{position:absolute;right:10px;top:36px;display:grid;place-items:center;border-radius:50%;background:white;width:54px;height:54px;font-size:30px;transform:rotate(10deg)}.art-caption{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:22px;background:white;color:var(--green);padding:10px 17px;font-size:12px;font-weight:600}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:750;line-height:1.7;color:var(--green);margin:12px 0}.title{font-size:42px;line-height:1.12;letter-spacing:-1.8px;margin:0 0 14px;font-weight:750}.body-copy{font-size:15px;line-height:1.55;color:var(--muted);margin:0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.chip{background:var(--soft);padding:7px 10px;border-radius:18px;font-size:11px}.dots{display:flex;justify-content:center;margin-top:12px;margin-bottom:6px}.dot-button{background:transparent;border:0;min-height:44px;padding:0 5px}.dot{display:block;height:7px;width:7px;background:#cccfc5;border-radius:4px}.dot-button[aria-current=step] .dot{width:24px;background:var(--green)}.primary,.secondary{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;background:var(--gold);color:var(--ink);font-size:16px;font-weight:750;padding:15px 18px;min-height:54px}.secondary{background:transparent;border:1px solid var(--border)}.center{text-align:center}.full-link{width:100%}.fine{font-size:11px;line-height:1.55;color:var(--muted);text-align:center;margin:12px 0 0}.login-brand{margin-top:30px}.login-copy{margin-top:38px}.login-copy .title{font-size:38px}.form{margin-top:28px}label{font-size:13px;font-weight:650;display:block;margin-bottom:9px}.field{min-height:54px;border:1px solid var(--border);border-radius:13px;background:white;padding:0 16px;font-size:16px;color:var(--ink);width:100%;min-width:0}.label-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.label-row label{margin:0}.password-row{display:flex;align-items:center;border:1px solid var(--border);border-radius:13px;background:white}.password-row input{border:0;background:transparent;min-height:54px;padding:0 16px;width:100%;min-width:0;font-size:16px;border-radius:13px}.show{min-width:58px;min-height:48px}.invalid{border-color:#a22d29!important}.error{font-size:12px;color:#a22d29;line-height:1.5;margin:7px 0 0}.notice{background:#e8eee5;padding:14px;border-radius:13px;font-size:12px;line-height:1.65;color:var(--green);margin:16px 0}.notice.error-box{background:#fdedea;color:#a22d29}.submit{margin-top:22px}.demo-box{background:var(--soft);border-radius:16px;padding:16px 16px 4px;margin:20px 0}.demo-box strong{font-size:14px}.demo-box p{font-size:12px;line-height:1.6;margin:5px 0 0;color:var(--muted)}.join{margin-top:24px;text-align:center}.splash{min-height:690px;display:flex;align-items:center;justify-content:center;flex-direction:column}.splash p{color:var(--muted);font-size:14px;margin-top:18px}.loader{width:22px;height:22px;border:2px solid #d5ddd1;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:36px 0 8px}@keyframes spin{to{transform:rotate(360deg)}}.check{margin:65px 0 24px;border-radius:50%;background:#e3ecdf;width:64px;height:64px;display:grid;place-items:center;font-size:32px;color:var(--green)}.home-card{background:white;padding:24px;border-radius:24px;margin-top:28px}.home-card .home-icon{font-size:40px;color:var(--green);margin-bottom:18px}.card-title{font-size:24px;font-weight:750;letter-spacing:-.7px;margin:0 0 14px}.modal{border:0;border-radius:24px;padding:26px;background:var(--bg);color:var(--ink);width:calc(100% - 48px);max-width:420px;box-shadow:0 20px 80px #20272233}.modal::backdrop{background:#20272277}.modal .primary{margin-top:24px}
@media(max-width:800px){main{display:block;padding:24px 14px;min-height:0;max-width:460px}.intro{margin:0 8px 24px;max-width:none}.intro h1{font-size:28px;letter-spacing:-1px;margin:12px 0}.intro>p:not(.meta){display:none}.preview-nav{margin:16px 0 10px}.meta{margin:0}.phone{min-height:730px}.device{border-width:5px;border-radius:30px}}@media(max-width:380px){main{padding:16px 0}.intro{margin:0 18px 20px}.device{border-radius:0;border:0;box-shadow:none}.phone{padding:20px 22px}.brand.compact{font-size:16px}.title{font-size:39px}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}

</head><body>
<main id="se-demo"><aside class="intro"><div class="kicker">STUDENT EXCHANGE / MOBILE CONCEPT</div><h1>A fresh start.<br>A familiar campus.</h1><p>Good finds, new connections, and a little more room in your student budget.</p><nav class="preview-nav" aria-label="Preview screens"><button data-action="welcome" aria-pressed="true">Welcome screens</button><button data-action="login" aria-pressed="false">Login screen</button></nav><p class="meta">Interactive preview · Android & iOS design<br>Sample data only. No backend connection.</p></aside><section class="device" aria-label="Mobile app preview"><div class="phone" id="app" aria-busy="false"></div></section></main>
<dialog class="modal" id="help" aria-labelledby="help-title"><h2 id="help-title" class="card-title"></h2><p class="body-copy" id="help-copy"></p><button class="primary" id="close-help">Got it</button></dialog>
<script>
/* Shared by the native app and offline browser preview. No network or storage. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.StudentExchangeAuth = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  const DEMO_EMAIL = 'demo@studentexchange.test';
  const DEMO_PASSWORD = 'CampusDemo!23';
  function normalizeEmail(email) { return email.trim().toLowerCase(); }
  function validate(email, password) {
    const errors = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizeEmail(email)))
      errors.email = 'Enter a valid email address.';
    if (!password) errors.password = 'Enter your password.';
    return errors;
  }
  function demoSignIn(email, password) {
    const errors = validate(email, password);
    if (Object.keys(errors).length) return { ok: false, errors };
    if (normalizeEmail(email) !== DEMO_EMAIL || password !== DEMO_PASSWORD)
      return { ok: false, errors: { form: 'This prototype accepts only the sample account. Use “Fill demo account” or “Explore the demo”.' } };
    return { ok: true, user: { name: 'Alex', email: DEMO_EMAIL } };
  }
  return { DEMO_EMAIL, DEMO_PASSWORD, normalizeEmail, validate, demoSignIn };
});

</script>
<script>
(()=>{
const auth=StudentExchangeAuth,root=document.getElementById('se-demo'),app=document.getElementById('app'),dialog=document.getElementById('help');
const slides=[{tag:'A LITTLE LESS SPENDING. A LOT MORE CAMPUS.',title:'Your campus.<br>Your exchange.',body:'A place to buy, sell, and share the things that make student life happen.',chips:['Textbooks','Everyday essentials','Campus finds']},{tag:'GOOD FINDS. CLOSE TO HOME.',title:'Pass it on.<br>Pick it up.',body:'Give your books and essentials a second semester. Discover something useful from another student.',chips:['Buy pre-loved','Sell what you outgrow']},{tag:'YOUR NEXT CHAPTER STARTS HERE.',title:'Less searching.<br>More connecting.',body:'Find your campus community and start your next exchange, one good find at a time.',chips:['Find your community','Make an exchange']}];
let screen='splash',step=0,email='',password='',show=false,busy=false,errors={},timer,helpTrigger;
const brand=compact=>`<div class="brand ${compact?'compact':''}"><span class="logo" aria-hidden="true">⇄</span><span>student<em>exchange</em></span></div>`;
const link=(label,action)=>`<button type="button" class="link" data-action="${action}">${label}</button>`;
function syncFields(){const e=app.querySelector('#email'),p=app.querySelector('#password');if(e)email=e.value;if(p)password=p.value;}
function navigate(next){syncFields();clearTimeout(timer);busy=false;screen=next;errors={};render();}
function render(){
root.querySelector('[data-action="welcome"]').setAttribute('aria-pressed',String(screen==='welcome'||screen==='splash'));
root.querySelector('[data-action="login"]').setAttribute('aria-pressed',String(screen==='login'));
app.setAttribute('aria-busy',String(busy));
if(screen==='splash'){app.innerHTML=`<div class="splash">${brand(false)}<p>Good things come around.</p><div class="loader" role="status" aria-label="Starting app"></div><span class="fine">Mobile demo</span></div>`;return;}
if(screen==='welcome'){
const slide=slides[step];app.innerHTML=`<div class="top">${brand(true)}${link('Skip','login')}</div><div class="art" aria-hidden="true"><div class="circle"></div><div class="book"><small>NEW CHAPTER</small><strong>${step===1?'Pass<br>it on.':'Campus<br>finds.'}</strong></div><div class="book gold"><small>SECOND SEMESTER</small><strong>${step===2?'Good<br>company.':'Good<br>as new.'}</strong></div><div class="swap">⇄</div><div class="art-caption">More life. Less waste.</div></div><div class="eyebrow">${slide.tag}</div><h2 class="title">${slide.title}</h2><p class="body-copy">${slide.body}</p><div class="chips">${slide.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="dots" aria-label="Welcome pages">${slides.map((_,i)=>`<button class="dot-button" data-action="step-${i}" aria-label="Welcome page ${i+1} of 3" ${i===step?'aria-current="step"':''}><span class="dot"></span></button>`).join('')}</div><button class="primary" data-action="continue">${step===2?'Get started':'Continue'} <span aria-hidden="true">→</span></button><div class="center">${link('Already here? Log in','login')}</div><p class="fine">Student Exchange · Mobile demo</p>`;return;}
if(screen==='login'){
app.innerHTML=`<div class="top">${link('← Back','welcome')}<span class="demo-badge">DEMO</span></div><div class="login-brand">${brand(false)}</div><div class="login-copy"><div class="eyebrow">YOUR CAMPUS CONNECTION</div><h2 class="title">Welcome back.</h2><p class="body-copy">A new semester of possibilities awaits.</p></div><form class="form" id="login-form" novalidate><label for="email">Email address</label><input class="field ${errors.email?'invalid':''}" id="email" name="email" type="email" autocomplete="email" autocapitalize="none" placeholder="you@university.edu" aria-invalid="${!!errors.email}" ${errors.email?'aria-describedby="email-error"':''}>${errors.email?`<p class="error" id="email-error" role="alert">${errors.email}</p>`:''}<div class="label-row"><label for="password">Password</label>${link('Forgot password?','reset')}</div><div class="password-row ${errors.password?'invalid':''}"><input id="password" name="password" type="${show?'text':'password'}" autocomplete="current-password" placeholder="Enter your password" aria-invalid="${!!errors.password}" ${errors.password?'aria-describedby="password-error"':''}><button class="link show" data-action="visibility" type="button" aria-label="${show?'Hide':'Show'} password">${show?'Hide':'Show'}</button></div>${errors.password?`<p class="error" id="password-error" role="alert">${errors.password}</p>`:''}${errors.form?`<div class="notice error-box" role="alert">${errors.form}</div>`:''}<button class="primary submit" type="submit">${busy?'Signing in…':'Log in <span aria-hidden="true">→</span>'}</button></form><div class="demo-box"><strong>Take it for a test drive.</strong><p>Use a sample account. No real credentials needed.</p>${link('Fill demo account','fill')}</div><button class="secondary" data-action="demo">Explore the demo</button><div class="join"><p class="body-copy">New to Student Exchange?</p>${link('Join the community','signup')}</div><p class="fine">Demo only · Login is not connected to the backend.</p><div class="center">${link('About this demo & privacy','privacy')}</div>`;
app.querySelector('#email').value=email;app.querySelector('#password').value=password;
if(busy)app.querySelectorAll('input,button').forEach(x=>x.disabled=true);
app.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();signIn();});return;}
app.innerHTML=`<div class="top">${brand(true)}<span class="demo-badge">DEMO</span></div><div class="check" aria-hidden="true">✓</div><div class="eyebrow">YOU'RE IN</div><h2 class="title">Hey, Alex.</h2><p class="body-copy">Welcome to your campus exchange.</p><div class="home-card"><div class="home-icon" aria-hidden="true">⇄</div><h3 class="card-title">Your next great find.</h3><p class="body-copy">The marketplace is our next chapter. For now, you've reached the end of the startup and login demo.</p></div><div class="notice" role="status">This is a sample session. No account was created and no backend request was sent.</div><button class="secondary" data-action="logout">Log out</button><div class="center">${link('Replay welcome screens','replay')}</div>`;
}
function enterDemo(){password='';show=false;errors={};screen='home';busy=false;render();}
function signIn(){if(busy)return;syncFields();errors=auth.validate(email,password);if(Object.keys(errors).length){render();app.querySelector(errors.email?'#email':'#password').focus();return;}busy=true;render();timer=setTimeout(()=>{const result=auth.demoSignIn(email,password);busy=false;if(result.ok)enterDemo();else{errors=result.errors;render();}},550);}
function help(kind){
const content={reset:['Need a fresh start?','Password recovery will connect to the verified backend in a later version. This demo cannot reset a password or send an email. Use the sample account to try the login flow.'],signup:['Your community is waiting.','Account creation and campus selection are planned for the next step. For now, explore with the sample account; no real account will be created.'],privacy:['A demo made for exploring.','This demo makes no network requests and stores no credentials. All state stays in memory and resets when the page closes. The sample account is public and does not grant access to the existing website.']}[kind];
helpTrigger=document.activeElement;document.getElementById('help-title').textContent=content[0];document.getElementById('help-copy').textContent=content[1];dialog.showModal();}
document.getElementById('close-help').onclick=()=>dialog.close();dialog.addEventListener('close',()=>helpTrigger?.focus());
root.addEventListener('click',event=>{
const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
const action=button.dataset.action;
if(action==='welcome'||action==='login')navigate(action);
else if(action==='continue'){if(step<2){step++;render();}else navigate('login');}
else if(action.startsWith('step-')){step=Number(action.slice(5));render();}
else if(action==='fill'){email=auth.DEMO_EMAIL;password=auth.DEMO_PASSWORD;errors={};render();app.querySelector('.submit').focus();}
else if(action==='visibility'){syncFields();show=!show;const p=app.querySelector('#password');p.type=show?'text':'password';button.textContent=show?'Hide':'Show';button.setAttribute('aria-label',`${show?'Hide':'Show'} password`);}
else if(action==='demo'){enterDemo();}
else if(action==='logout'||action==='replay'){email='';password='';show=false;step=0;screen=action==='logout'?'login':'welcome';errors={};render();}
else help(action);
});
render();timer=setTimeout(()=>navigate('welcome'),850);
})();
</script></body></html>
